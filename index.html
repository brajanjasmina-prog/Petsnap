<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSnap - Social Media for Pet Lovers</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-light: #FBE9E7;
            --background: #FAFAFA;
            --surface: #FFFFFF;
            --text-main: #222222;
            --text-secondary: #777777;
            --border: #EEEEEE;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--background); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; max-height: 896px; background: var(--surface); display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        @media (min-width: 415px) { .app-container { height: 844px; border-radius: 40px; border: 8px solid #333; } }
        .app-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); z-index: 10; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .app-content { flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item span.icon { font-size: 22px; }
        .post { background: var(--surface); border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; padding: 12px 16px; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .post-image { width: 100%; height: 350px; object-fit: cover; }
        .post-actions { padding: 12px 16px; display: flex; gap: 15px; font-size: 20px; }
        .post-caption { padding: 0 16px 16px 16px; font-size: 14px; }
        .gumroad-card { background: var(--primary-light); border: 2px solid #FFCCBC; border-radius: 20px; padding: 24px 20px; text-align: center; margin-top: 10px; }
        .gumroad-btn { display: block; background: var(--primary); color: white; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 15px; box-shadow: 0 4px 12px rgba(255,87,34,0.3); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="logo">🐾 PetSnap</div>
        <div style="font-size: 20px; cursor: pointer;">🔔</div>
    </div>
    <div class="app-content">
        <div id="screen-home" class="screen active">
            <div style="font-weight: bold; margin-bottom: 12px; font-size: 16px;">🔥 Pet of the Day</div>
            <div class="post">
                <div class="post-header">
                    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1" class="avatar">
                    <span class="username" style="font-weight: 600; font-size: 14px;">max_the_golden</span>
                </div>
                <img src="https://images.unsplash.com/photo-1552053831-71594a27632d" class="post-image">
                <div class="post-actions"><span>❤️</span> <span>💬</span> <span>✈️</span></div>
                <div class="post-caption"><strong>max_the_golden</strong> Uživam u sunčanju! ☀️🐾</div>
            </div>
        </div>
        <div id="screen-explore" class="screen">
            <h2 style="margin-bottom: 15px;">Otkrij ljubimce</h2>
            <input type="text" placeholder="Pretraži pasmine..." style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; outline: none;">
        </div>
        <div id="screen-ai" class="screen">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 40px;">✨🐾</span>
                <h2>PetSnap AI Studio</h2>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Stvori AI portrete za svog ljubimca!</p>
            </div>
            <div class="gumroad-card">
                <h3 style="color: var(--primary); margin-bottom: 6px;">PetSnap Pro Pass 🚀</h3>
                <p style="font-size: 22px; font-weight: bold; margin-bottom: 12px;">$4.99 <span style="font-size: 14px; font-weight: normal; color: #555;">/ mjesečno</span></p>
                <a href="https://gumroad.com/l/tvoj-gumroad-proizvod-id" target="_blank" class="gumroad-btn">💳 Kupi preko Gumroada</a>
            </div>
        </div>
        <div id="screen-profile" class="screen">
            <div style="text-align: center; padding: 20px 0;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
                <h3>Jasmina brajan 🐾</h3>
                <p style="color: var(--text-secondary); font-size: 13px;">Kreatorica PetSnap aplikacije.</p>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchScreen('home', this)"><span class="icon">🏠</span><span>Početna</span></button>
        <button class="nav-item" onclick="switchScreen('explore', this)"><span class="icon">🔍</span><span>Otkrij</span></button>
        <button class="nav-item" onclick="switchScreen('ai', this)"><span class="icon">✨</span><span>AI Studio</span></button>
        <button class="nav-item" onclick="switchScreen('profile', this)"><span class="icon">👤</span><span>Profil</span></button>
    </div>
</div>
<script>
    function switchScreen(name, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + name).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
